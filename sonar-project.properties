# SonarCloud analysis config (public repo, automatic analysis).
# Project key / organization are set by the SonarCloud GitHub binding, not here.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
# Generated code is not hand-maintained — exclude it from issues/duplication.
sonar.exclusions=**/_generated/**,src/lib/api/types.ts,.next/**,coverage/**
